# Checks every push and pull request; builds the site and publishes it to GitHub Pages from main.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: CI & Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Lint, format, typecheck and unit tests.
      - run: npm run check

      - name: Build
        run: npm run build
        env:
          # Project sites live under /<repo>/; a custom domain would use "/".
          BASE_PATH: /${{ github.event.repository.name }}/
          OUT_DIR: ${{ github.workspace }}/_site

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
